name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # SkiaSharp needs fontconfig + at least one TTF; ubuntu runners have neither
      # for the managed font manager (text silently doesn't render otherwise)
      - name: fonts (linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fontconfig fonts-dejavu-core

      # Burn integration tests resolve ffmpeg via PATH — install per-OS
      # (setup-ffmpeg action lacks arm64 macOS binaries and exact version pins)
      - name: ffmpeg (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get install -y ffmpeg

      - name: ffmpeg (windows)
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress

      - name: ffmpeg (macos)
        if: runner.os == 'macOS'
        run: brew install ffmpeg

      - name: ffmpeg available
        shell: bash
        run: ffmpeg -version | head -1

      - name: test
        run: dotnet test SubtitleBurner.slnx --nologo

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: pack
        run: dotnet pack src/SubtitleBurner/SubtitleBurner.csproj -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          retention-days: 14
