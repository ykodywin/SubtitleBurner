name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      # Burn integration tests resolve ffmpeg via PATH; it is preinstalled on
      # all three GitHub runner images
      - name: ffmpeg available
        run: ffmpeg -version | head -1

      - name: test
        run: dotnet test SubtitleBurner.slnx --nologo

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: pack
        run: dotnet pack src/SubtitleBurner/SubtitleBurner.csproj -c Release -o artifacts

      - uses: actions/upload-artifact@v4
        with:
          name: nupkg
          path: artifacts/*.nupkg
          retention-days: 14
